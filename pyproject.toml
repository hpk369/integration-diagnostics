[project]
name = "integration-diagnostics"
version = "0.1.0"
description = "Turns the evidence customers send (HAR, SAML, JWT, logs, webhook records) into a structured diagnosis and an escalation report."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long strings and docstrings are fine

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header() in argument defaults is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
exclude = ["^\\.claude/", "^\\.venv/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["acme_shield.*", "diagx.*"]
disallow_untyped_defs = true

# Temporary: this test imports a module that ACME-8 creates. Delete this block in ACME-8.
[[tool.mypy.overrides]]
module = ["tests.diagx.test_models"]
ignore_errors = true
